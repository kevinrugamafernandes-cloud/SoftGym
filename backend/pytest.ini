[pytest]
testpaths = app/tests
asyncio_mode = auto
markers =
    cash_required: la prueba exige caja abierta para cobrar (regla de producción)
filterwarnings =
    # Advertencias de librerías de terceros (no del código de SoftGym)
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
    # test_token_firmado_con_otra_clave usa a propósito una clave corta
    ignore::jwt.warnings.InsecureKeyLengthWarning
